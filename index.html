<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Manager - Add New Entry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .header p {
            color: #999;
            font-size: 0.95em;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .form-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 25px;
            animation: slideIn 0.4s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.15s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.25s; }
        .form-group:nth-child(5) { animation-delay: 0.3s; }
        .form-group:nth-child(6) { animation-delay: 0.35s; }
        .form-group:nth-child(7) { animation-delay: 0.4s; }
        .form-group:nth-child(8) { animation-delay: 0.45s; }
        .form-group:nth-child(9) { animation-delay: 0.5s; }
        .form-group:nth-child(10) { animation-delay: 0.55s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 0.9em;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #1a1a1a;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #e0e0e0 0%, #c0c0c0 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #a5d6a7;
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #ef9a9a;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .form-card {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.6em;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCRIPT MANAGER</h1>
            <p>Add New Entry to Firebase Database</p>
        </div>

        <div class="form-card">
            <form id="scriptForm">
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Growlauncher">Growlauncher</option>
                        <option value="GTPS">GTPS</option>
                        <option value="RGT">RGT</option>
                        <option value="Genta">Genta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" required placeholder="Enter script name">
                </div>

                <div class="form-group">
                    <label for="content">Content *</label>
                    <textarea id="content" required placeholder="Enter content description"></textarea>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <input type="text" id="description" required placeholder="Enter description">
                </div>

                <div class="form-group">
                    <label for="latest">Latest *</label>
                    <input type="text" id="latest" required placeholder="e.g., yes, v1.0, V5.24">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="text" id="password" placeholder="Enter password (optional)">
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <input type="text" id="status" required placeholder="e.g., V6.1.29">
                </div>

                <div class="form-group">
                    <label for="linkdownload">Link Download</label>
                    <input type="url" id="linkdownload" placeholder="https://example.com/download">
                </div>

                <div class="form-group">
                    <label for="youtubeShowcase">YouTube Showcase</label>
                    <input type="url" id="youtubeShowcase" placeholder="https://youtube.com/...">
                </div>

                <div class="form-group">
                    <label for="youtubeTutorial">YouTube Tutorial</label>
                    <input type="url" id="youtubeTutorial" placeholder="https://youtube.com/...">
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-submit">
                        Submit
                    </button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>

                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCldbqiZLTRvtQCfO9_2EiBGeND9fxALCE",
            authDomain: "x-website-script.firebaseapp.com",
            projectId: "x-website-script",
            storageBucket: "x-website-script.firebasestorage.app",
            messagingSenderId: "848346981755",
            appId: "1:848346981755:web:aff6aa81591ff35f2509de"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('scriptForm');
        const statusMessage = document.getElementById('statusMessage');

        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = form.querySelector('.btn-submit');
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = 'Submitting <span class="loading"></span>';
            submitBtn.disabled = true;

            const formData = {
                category: document.getElementById('category').value,
                name: document.getElementById('name').value,
                content: document.getElementById('content').value,
                description: document.getElementById('description').value,
                latest: document.getElementById('latest').value,
                password: document.getElementById('password').value || '',
                status: document.getElementById('status').value,
                linkdownload: document.getElementById('linkdownload').value || '',
                youtubeShowcase: document.getElementById('youtubeShowcase').value || '',
                youtubeTutorial: document.getElementById('youtubeTutorial').value || ''
            };

            try {
                const docRef = await addDoc(collection(db, 'scripts'), formData);
                showMessage('✓ Data berhasil ditambahkan! Document ID: ' + docRef.id, 'success');
                form.reset();
            } catch (error) {
                console.error('Error:', error);
                showMessage('✗ Error: ' + error.message, 'error');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
